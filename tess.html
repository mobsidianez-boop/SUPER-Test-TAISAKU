<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyDash - 限界突破ボリューム版</title>
<style>
  :root {
    --primary: #4A90E2;
    --primary-dark: #357ABD;
    --bg-color: #F4F7F6;
    --card-bg: #FFFFFF;
    --text-main: #333333;
    --text-muted: #777777;
    --success: #2ECC71;
    --danger: #E74C3C;
  }
  
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    margin: 0;
    padding: 20px 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .dashboard {
    background: var(--card-bg);
    width: 90%;
    max-width: 650px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    overflow: hidden;
    margin-bottom: 30px;
  }

  .header {
    background: var(--primary);
    color: white;
    padding: 20px;
    text-align: center;
  }
  .header h1 {
    margin: 0;
    font-size: 1.8rem;
    letter-spacing: 2px;
  }
  .header p {
    margin: 5px 0 0 0;
    font-size: 0.95rem;
    opacity: 0.9;
  }

  .content-area {
    padding: 30px;
  }

  /* メニュー画面 */
  #menu-screen {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .form-group label {
    font-weight: bold;
    color: var(--primary-dark);
  }
  select {
    padding: 12px;
    font-size: 1rem;
    border: 2px solid #E0E0E0;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.3s;
    background-color: #FAFAFA;
  }
  select:focus {
    border-color: var(--primary);
  }
  
  .btn {
    padding: 15px;
    font-size: 1.2rem;
    font-weight: bold;
    color: white;
    background: var(--primary);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, transform 0.1s;
    margin-top: 10px;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled {
    background: #cccccc;
    cursor: not-allowed;
  }

  /* クイズ画面 */
  #quiz-screen, #result-screen {
    display: none;
  }
  
  .quiz-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-weight: bold;
    color: var(--text-muted);
  }
  
  .question-text {
    font-size: 1.25rem;
    line-height: 1.6;
    margin-bottom: 30px;
    font-weight: bold;
  }
  
  .options-grid {
    display: grid;
    gap: 12px;
  }
  
  .option-btn {
    padding: 15px;
    font-size: 1.05rem;
    background: #F8F9FA;
    border: 2px solid #E0E0E0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    word-break: break-all;
  }
  .option-btn:hover {
    background: #EAF2F8;
    border-color: var(--primary);
  }
  .option-btn.correct {
    background: var(--success);
    color: white;
    border-color: var(--success);
  }
  .option-btn.wrong {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
  }

  /* 結果画面 */
  .result-box {
    text-align: center;
  }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.5rem;
    font-weight: bold;
    margin: 0 auto 20px auto;
  }
  .result-details {
    margin-bottom: 25px;
    font-size: 1.1rem;
    color: var(--text-muted);
  }

</style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <h1>StudyDash</h1>
    <p>🔥 限界突破！全53問フル収録版 🔥</p>
  </div>

  <div class="content-area">
    <!-- メニュー画面 -->
    <div id="menu-screen">
      <div class="form-group">
        <label for="subject-select">📚 教科</label>
        <select id="subject-select">
          <option value="" disabled selected>教科を選択してください</option>
        </select>
      </div>
      <div class="form-group">
        <label for="category-select">🔖 区分</label>
        <select id="category-select" disabled>
          <option value="" disabled selected>先に教科を選んでください</option>
        </select>
      </div>
      <button class="btn" id="start-btn" disabled>ダッシュ開始！ 🚀</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen">
      <div class="quiz-header">
        <span id="current-category-label">カテゴリ名</span>
        <span id="progress-label">Q 1/5</span>
      </div>
      <div class="question-text" id="question-text">
        問題文がここに入ります。
      </div>
      <div class="options-grid" id="options-grid">
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen">
      <div class="result-box">
        <h2>トレーニング完了！</h2>
        <div class="score-circle" id="score-display">100%</div>
        <div class="result-details" id="result-details">全10問中 8問正解</div>
        <p id="feedback-msg" style="font-weight:bold; margin-bottom: 20px;">よくできました！</p>
        <button class="btn" style="width: 100%;" onclick="returnToMenu()">メニューに戻る</button>
      </div>
    </div>
  </div>
</div>

<script>

const studyData = {

    ],
    "3. 九州地方（自然・農業）": [
      { q: "九州の北西部に連なる、湾と岬が複雑に入り組んだ海岸地形を何というか？", options: ["リアス海岸", "砂浜海岸", "サンゴ礁", "フィヨルド"], answer: "リアス海岸" },

      { q: "沖縄県において、農業で多く栽培されている作物はさとうきびと何か？", options: ["パイナップル", "りんご", "みかん", "お茶"], answer: "パイナップル" },
      { q: "沖縄県の大きな課題の一つである、日本にある施設の多くが集中しているものは何か？", options: ["アメリカ軍基地", "原子力発電所", "工業地帯", "過疎地域"], answer: "アメリカ軍基地" },
      { q: "沖縄県で、かつて行われていた伝統的な織物や染物などの産業を何というか？", options: ["伝統的工芸品産業", "重化学工業", "先端技術産業", "情報通信産業"], answer: "伝統的工芸品産業" }

};

// DOM要素
const subjectSelect = document.getElementById('subject-select');
const categorySelect = document.getElementById('category-select');
const startBtn = document.getElementById('start-btn');
const menuScreen = document.getElementById('menu-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');

// クイズ用変数
let currentQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let isAnswering = false;

// 1. メニューの初期化
Object.keys(studyData).forEach(subject => {
  const option = document.createElement('option');
  option.value = subject;
  option.textContent = subject;
  subjectSelect.appendChild(option);
});

// 教科が選ばれたら区分を更新
subjectSelect.addEventListener('change', (e) => {
  const subject = e.target.value;
  categorySelect.innerHTML = '<option value="" disabled selected>区分を選択してください</option>';
  categorySelect.disabled = false;
  startBtn.disabled = true;
  
  Object.keys(studyData[subject]).forEach(category => {
    const option = document.createElement('option');
    option.value = category;
    option.textContent = category;
    categorySelect.appendChild(option);
  });
});

// 区分が選ばれたらスタートボタンを有効化
categorySelect.addEventListener('change', () => {
  startBtn.disabled = false;
});

// 2. クイズの開始
startBtn.addEventListener('click', () => {
  const subject = subjectSelect.value;
  const category = categorySelect.value;
  
  // 出題順をシャッフルするために配列をコピー
  currentQuestions = [...studyData[subject][category]];
  currentQuestions.sort(() => Math.random() - 0.5);
  
  currentQuestionIndex = 0;
  score = 0;
  
  document.getElementById('current-category-label').textContent = `${subject} > ${category}`;
  
  menuScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  
  loadQuestion();
});

// 3. 問題の読み込みと表示
function loadQuestion() {
  isAnswering = false;
  const qData = currentQuestions[currentQuestionIndex];
  
  document.getElementById('progress-label').textContent = `Q ${currentQuestionIndex + 1}/${currentQuestions.length}`;
  document.getElementById('question-text').textContent = qData.q;
  
  const optionsGrid = document.getElementById('options-grid');
  optionsGrid.innerHTML = '';
  
  // 選択肢も毎回シャッフル
  const shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);
  
  shuffledOptions.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, opt, qData.answer);
    optionsGrid.appendChild(btn);
  });
}

// 4. 正誤判定
function checkAnswer(selectedBtn, selectedText, correctText) {
  if (isAnswering) return; // 連打防止
  isAnswering = true;
  
  const allBtns = document.querySelectorAll('.option-btn');
  
  if (selectedText === correctText) {
    selectedBtn.classList.add('correct');
    score++;
  } else {
    selectedBtn.classList.add('wrong');
    // 間違えた場合、正解のボタンを緑色にして教える
    allBtns.forEach(btn => {
      if (btn.textContent === correctText) btn.classList.add('correct');
    });
  }
  
  // 1秒後に次の問題へ
  setTimeout(() => {
    currentQuestionIndex++;
    if (currentQuestionIndex < currentQuestions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }, 1000);
}

// 5. 結果画面の表示
function showResult() {
  quizScreen.style.display = 'none';
  resultScreen.style.display = 'block';
  
  const percentage = Math.round((score / currentQuestions.length) * 100);
  const scoreDisplay = document.getElementById('score-display');
  const resultDetails = document.getElementById('result-details');
  const feedback = document.getElementById('feedback-msg');
  
  scoreDisplay.textContent = `${percentage}%`;
  resultDetails.textContent = `全${currentQuestions.length}問中 ${score}問正解`;
  
  if (percentage === 100) {
    scoreDisplay.style.background = 'var(--success)';
    feedback.textContent = 'パーフェクト！！完璧に理解しています！🔥';
    feedback.style.color = 'var(--success)';
  } else if (percentage >= 70) {
    scoreDisplay.style.background = 'var(--primary)';
    feedback.textContent = '素晴らしい！その調子で頑張りましょう！👍';
    feedback.style.color = 'var(--primary)';
  } else {
    scoreDisplay.style.background = 'var(--danger)';
    feedback.textContent = 'あともう少し！間違えた問題を復習しよう💪';
    feedback.style.color = 'var(--danger)';
  }
}

// メニューへ戻る
function returnToMenu() {
  resultScreen.style.display = 'none';
  menuScreen.style.display = 'flex';
}
</script>
