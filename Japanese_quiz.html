<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中2国語 定期テスト対策マスターMINI</title>
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f0f8ff;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: left;
            white-space: pre-wrap;
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .choice-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: left;
        }
        .choice-btn:hover {
            background-color: #2980b9;
        }
        .choice-btn:active {
            transform: scale(0.98);
        }
        .choice-btn.correct {
            background-color: #2ecc71 !important;
        }
        .choice-btn.incorrect {
            background-color: #e74c3c !important;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #34495e;
        }
        #feedback {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 35px;
        }
        .correct-text {
            color: #2ecc71;
        }
        .incorrect-text {
            color: #e74c3c;
        }
        #explanation {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: left;
            display: none;
        }
        #next-btn, #restart-btn {
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 0 auto;
        }
        #next-btn:hover, #restart-btn:hover {
            background-color: #d68910;
        }
        #result-container {
            display: none;
        }
        .score-display {
            font-size: 36px;
            font-weight: bold;
            color: #e67e22;
            margin: 20px 0;
        }
        .message-display {
            font-size: 18px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>中2国語 マスターMINI</h1>
    <div class="subtitle">熟語の構成 / クマゼミ / 短歌</div>

    <div id="quiz-area">
        <div class="status-bar">
            <span id="question-counter">問題 1 / 10</span>
            <span id="score-counter">スコア: 0</span>
        </div>
        
        <div id="question-text" class="question-text">ここに問題が表示されます。</div>
        
        <div id="choices-container" class="choices-container">
        </div>

        <div id="feedback"></div>
        <div id="explanation"></div>
        
        <button id="next-btn">次の問題へ</button>
    </div>

    <div id="result-container">
        <h2>テスト終了！</h2>
        <div class="score-display" id="final-score">10 / 10</div>
        <div class="message-display" id="final-message">完璧です！</div>
        <button id="restart-btn">もう一度挑戦する</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "「洗顔」という熟語の構成として正しいものはどれ？",
            choices: [
                "意味が似ている漢字の組み合わせ",
                "下の漢字が上の漢字の目的や対象を示す",
                "上の漢字が下の漢字を修飾する"
            ],
            correct: 1,
            explanation: "「洗顔」は「顔（対象）を洗う」という関係になります。"
        },
        {
            question: "「軽傷」は「上の漢字が下の漢字を修飾する」構成です。では、「主語と述語の関係」にあたる熟語はどれ？",
            choices: [
                "善悪",
                "拡大",
                "日照"
            ],
            correct: 2,
            explanation: "「日照」は「日が照る」と読めるため、主語と述語の関係です。「善悪」は対になる意味、「拡大」は似た意味の組み合わせです。"
        },
        {
            question: "上に打ち消しの意味を持つ漢字が付く三字熟語があります。この打ち消しの意味を持つ漢字として当てはまらないものはどれ？",
            choices: [
                "的",
                "不",
                "未"
            ],
            correct: 0,
            explanation: "打ち消しの意味を持つのは「不・無・非・未」などです。「的」は「絶対的」などのように言葉の下に付く漢字です。"
        },
        {
            question: "「春夏秋冬」という四字熟語の構成として正しい説明はどれ？",
            choices: [
                "漢字一字の言葉の組み合わせ",
                "二字熟語の組み合わせ",
                "漢字一字の言葉と二字熟語の組み合わせ"
            ],
            correct: 0,
            explanation: "「春・夏・秋・冬」という漢字一字の言葉が組み合わさっています。"
        },
        {
            question: "大阪府内の都市部でクマゼミが増加したことと、冬の寒さの緩和には、どのような関係がありましたか？",
            choices: [
                "気温上昇と重なって大きな関係があった",
                "検証の範囲では関連が認められなかった",
                "アブラゼミを減らす要因になっていた"
            ],
            correct: 1,
            explanation: "文章中には、「冬の寒さの緩和は関係がなかった」と明記されています。"
        },
        {
            question: "地表の整備によって土が硬くなった環境で、クマゼミが生き残った理由は何ですか？",
            choices: [
                "他のセミが減る一方で、クマゼミだけが土に潜らずに生きられたから",
                "クマゼミは硬い土に潜る能力が圧倒的に高かったから",
                "ヒートアイランド現象により地表が暖かくなったから"
            ],
            correct: 1,
            explanation: "他のセミが硬い土に潜れなくなる中、クマゼミは硬い土に潜る能力が圧倒的に高かったと実験で証明されています。"
        },
        {
            question: "筆者は、生物の数や分布の変化について結論を得るために、何が必要だと述べていますか？",
            choices: [
                "地表の整備と気温上昇の二点だけを関連づけること",
                "短期間で直感的に原因を決めること",
                "何年もの間、実験や観察を重ねること"
            ],
            correct: 2,
            explanation: "生物の変化は簡単に一つに関連づけて語られがちですが、結論を得るには何年もの間、実験や観察を重ねる必要があるとまとめられています。"
        },
        {
            question: "短歌は、基本としていくつの音から成り立っている詩ですか？",
            choices: [
                "五・七・五・七・七の三十一音",
                "五・七・五の十七音",
                "五・七・七の十九音"
            ],
            correct: 0,
            explanation: "短歌は、五・七・五・七・七の三十一音の定型を持つ日本の詩です。"
        },
        {
            question: "次の短歌の作者は誰ですか？\n「鯨の世紀恐竜の世紀いづれにも戻れぬ地球の水仙の白」",
            choices: [
                "俵万智",
                "馬場あき子",
                "栗木京子"
            ],
            correct: 1,
            explanation: "「鯨の世紀〜」の作者は馬場あき子です。ちなみに俵万智は「蛇行する川には〜」の作者です。"
        },
        {
            question: "俵万智の短歌「蛇行する川には蛇行の理由あり急げばいいってもんじゃないよと」について。曲がりくねったり寄り道したりするのには「何がある」と詠んでいますか？",
            choices: [
                "必ず理由のあること",
                "人間の未来に対する不安",
                "早く進むためのヒント"
            ],
            correct: 0,
            explanation: "蛇行すること（寄り道など）には「必ず理由のあることなのだ」と、生きることとの重なり合いに気づいたことが解説されています。"
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    const questionCounterEl = document.getElementById('question-counter');
    const scoreCounterEl = document.getElementById('score-counter');
    const questionTextEl = document.getElementById('question-text');
    const choicesContainerEl = document.getElementById('choices-container');
    const feedbackEl = document.getElementById('feedback');
    const explanationEl = document.getElementById('explanation');
    const nextBtnEl = document.getElementById('next-btn');
    const quizAreaEl = document.getElementById('quiz-area');
    const resultContainerEl = document.getElementById('result-container');
    const finalScoreEl = document.getElementById('final-score');
    const finalMessageEl = document.getElementById('final-message');
    const restartBtnEl = document.getElementById('restart-btn');

    function initGame() {
        currentQuestionIndex = 0;
        score = 0;
        quizAreaEl.style.display = 'block';
        resultContainerEl.style.display = 'none';
        updateScore();
        loadQuestion();
    }

    function loadQuestion() {
        canAnswer = true;
        feedbackEl.innerHTML = '';
        explanationEl.style.display = 'none';
        nextBtnEl.style.display = 'none';
        
        const q = questions[currentQuestionIndex];
        questionCounterEl.textContent = `問題 ${currentQuestionIndex + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        
        choicesContainerEl.innerHTML = '';
        q.choices.forEach((choice, index) => {
            const button = document.createElement('button');
            button.className = 'choice-btn';
            button.textContent = choice;
            button.onclick = () => selectChoice(index, button);
            choicesContainerEl.appendChild(button);
        });
    }

    function selectChoice(selectedIndex, button) {
        if (!canAnswer) return;
        canAnswer = false;

        const q = questions[currentQuestionIndex];
        const buttons = choicesContainerEl.querySelectorAll('.choice-btn');

        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.correct) {
            button.classList.add('correct');
            feedbackEl.innerHTML = '<span class="correct-text">⭕ 正解！</span>';
            score++;
            updateScore();
        } else {
            button.classList.add('incorrect');
            buttons[q.correct].classList.add('correct'); 
            feedbackEl.innerHTML = '<span class="incorrect-text">❌ 不正解...</span>';
        }

        explanationEl.textContent = q.explanation;
        explanationEl.style.display = 'block';
        nextBtnEl.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function updateScore() {
        scoreCounterEl.textContent = `スコア: ${score}`;
    }

    function showResult() {
        quizAreaEl.style.display = 'none';
        resultContainerEl.style.display = 'block';
        finalScoreEl.textContent = `${score} / ${questions.length}`;
        
        let message = '';
        if (score === questions.length) {
            message = '素晴らしい！完璧です！テストはバッチリ！🏆';
        } else if (score >= questions.length * 0.7) {
            message = 'よくできました！この調子でもう一息！👍';
        } else {
            message = '惜しい！解説をよく読んで復習しよう！💪';
        }
        finalMessageEl.textContent = message;
    }

    nextBtnEl.addEventListener('click', nextQuestion);
    restartBtnEl.addEventListener('click', initGame);

    initGame();
</script>

</body>
</html>
